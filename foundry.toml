[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
build_info = true
build_info_path = "out/build-info"
# The same source gives the same bytecode on every chain, so deployments can be verified.
bytecode_hash = "none"
cbor_metadata = false
skip = ["test/CorkLopE2E.t.sol"]

[profile.lop]
via_ir = true
skip = []

[invariant]
runs = 256
